import*as T from'./three.module.js';import{GLTFLoader}from'./GLTFLoader.js';import{OrbitControls}from'./OrbitControls.js';const root=new URL('./',location.href),u=x=>new URL(x,root),M=await(await fetch(u('phase4b-render-manifest.json'))).json(),ids=M.entries.map(x=>x.characterId),sel=document.querySelector('#chars'),classes=['PASS_TEXTURE_CLEAN','PASS_WITH_GEOMETRY_NOTICE','TEXTURE_RESIDUAL','TEXTURE_OVERPAINT','OTHER_VISUAL_FAIL'];ids.forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;sel.append(o)});let reviews=JSON.parse(localStorage.phase4bHumanReview||'{}'),i=0,mode='normal',model,bindings=[],basePos,baseTarget,renderer=new T.WebGLRenderer({canvas:c,antialias:true}),scene=new T.Scene(),camera=new T.PerspectiveCamera(32,1,.01,50),ctl=new OrbitControls(camera,c);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;scene.background=new T.Color(0x202632);scene.add(new T.HemisphereLight(0xddeeff,0x473d35,2.3));let l=new T.DirectionalLight(0xffffff,3);l.position.set(3,5,4);scene.add(l);function updateReview(){let r=reviews[ids[i]]||{};document.querySelector('#class').value=r.classification||'';document.querySelector('#notes').value=r.notes||'';let n=Object.keys(reviews).filter(x=>reviews[x].classification).length;document.querySelector('#counts').textContent=`Reviewed ${n} / ${ids.length} · `+classes.map(x=>`${x}: ${Object.values(reviews).filter(r=>r.classification===x).length}`).join(' · ')}function saveReview(){let k=ids[i];reviews[k]={classification:document.querySelector('#class').value,notes:document.querySelector('#notes').value,updatedAt:new Date().toISOString()};localStorage.phase4bHumanReview=JSON.stringify(reviews);updateReview()}function download(){let blob=new Blob([JSON.stringify({phase:'4B HUMAN REVIEW VIA SHARED THREE.JS VIEWER',status:'PENDING_HUMAN_REVIEW',reviews},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='phase4b-human-review.json';a.click();URL.revokeObjectURL(a.href)}async function load(){let r=M.entries[i];sel.value=r.characterId;status.textContent=r.characterId+' · '+mode.toUpperCase();if(model)scene.remove(model);model=(await new GLTFLoader().loadAsync(u(r.sourceGlb))).scene;bindings=[];model.traverse(n=>{if(n.isMesh)for(let m of(Array.isArray(n.material)?n.material:[n.material]))if(m?.map)bindings.push({m,orig:m.map})});let box=new T.Box3().setFromObject(model),s=box.getSize(new T.Vector3());model.scale.setScalar(2.8/s.y);model.updateMatrixWorld(true);box.setFromObject(model);model.position.sub(box.getCenter(new T.Vector3()));camera.position.set(0,.05,Math.max(1.1,box.getSize(new T.Vector3()).y*1.15));ctl.target.set(0,.05,0);ctl.update();basePos=camera.position.clone();baseTarget=ctl.target.clone();scene.add(model);await apply();updateReview()}async function apply(){let r=M.entries[i];for(let x of bindings)x.m.map=x.orig;if(mode!=='normal'){let t=await new T.TextureLoader().loadAsync(u(mode==='clean'?r.cleanAtlas:r.targetVisualization));t.flipY=false;t.colorSpace=T.SRGBColorSpace;for(let x of bindings)x.m.map=t}for(let x of bindings)x.m.needsUpdate=true;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}sel.onchange=()=>{i=ids.indexOf(sel.value);load()};prev.onclick=()=>{i=(i+ids.length-1)%ids.length;load()};next.onclick=()=>{i=(i+1)%ids.length;load()};reset.onclick=()=>{camera.position.copy(basePos);ctl.target.copy(baseTarget);ctl.update()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;apply()});document.querySelector('#save').onclick=saveReview;document.querySelector('#export').onclick=download;addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight-130,false);camera.aspect=innerWidth/(innerHeight-130);camera.updateProjectionMatrix()});await load();dispatchEvent(new Event('resize'));(function f(){requestAnimationFrame(f);ctl.update();renderer.render(scene,camera
